[package]
name = "xai-grok-pager-bin"
version = "0.2.102"
edition.workspace = true
license = "Apache-2.0"
authors = ["xAI"]
default-run = "xai-grok-pager"

# Composition-root binary for the Grok Build TUI. The artifact is still named
# `xai-grok-pager`. This package exists so the binary can link both the pager
# library and the optional `xai-grok-pager-minimal` render mode: `minimal`
# depends on `xai-grok-pager`, so the pager library cannot depend back on it
# (cargo cycle). The binary installs the minimal-mode IoC hooks at startup.
[[bin]]
name = "xai-grok-pager"
path = "src/main.rs"

# Grok OSS public CLI entry (same main as xai-grok-pager).
[[bin]]
name = "grok-oss"
path = "src/main.rs"

# Legacy Goblin alias (same main); prefer `grok-oss` for new installs.
[[bin]]
name = "goblin"
path = "src/main.rs"

[dependencies]
# The pager library (all application logic + the public API main.rs drives).
xai-grok-pager = { path = "../xai-grok-pager" }
# Optional scrollback-native render mode, wired in via the fn-pointer seam.
xai-grok-pager-minimal = { path = "../xai-grok-pager-minimal" }

# Agent runtime + leader/stdio/headless entry points.
xai-grok-shell = { workspace = true }
xai-grok-tower = { path = "../xai-grok-tower" }
xai-grok-app-server = { path = "../xai-grok-app-server" }
xai-grok-app-server-protocol = { path = "../xai-grok-app-server-protocol" }
# MCP Streamable HTTP server (POST/GET/DELETE /mcp). Optional, gated by the
# `mcp-streamable-http` feature so the default build stays zero-network on the
# MCP side (the listener itself lives in `xai-grok-mcp-server` behind its
# `streamable-http` feature).
xai-grok-mcp-server = { path = "../xai-grok-mcp-server", optional = true }
# HTTP client used by the composition black-box test for the experimental
# MCP Streamable HTTP listener. Optional, gated by the `mcp-streamable-http`
# feature (same pattern as the WS test client above).
reqwest = { workspace = true, optional = true }
# WebSocket client used by the composition black-box test for the experimental
# app-server WS listener. Optional, gated by the `app-server-ws` feature so the
# default build stays zero-network on the app-server side (the listener itself
# lives in `xai-grok-app-server` behind its `websocket` feature).
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
xai-grok-auth = { workspace = true }
xai-grok-multi-auth = { workspace = true }
xai-grok-update = { path = "../xai-grok-update" }
xai-grok-version = { workspace = true }
xai-grok-telemetry = { workspace = true }
xai-grok-workspace = { workspace = true }
dirs = { workspace = true }
webbrowser = { workspace = true }
xai-crash-handler = { path = "../xai-crash-handler" }
xai-acp-lib = { workspace = true }

# Async runtime + misc.
tokio = { workspace = true, features = [
    "sync",
    "rt",
    "macros",
    "rt-multi-thread",
    "signal",
    "io-util",
    "io-std",
] }
tokio-util = { workspace = true, features = ["compat"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
dunce = { workspace = true }
semver = { workspace = true }
xai-tty-utils = { workspace = true }
xai-grok-config = { workspace = true }
xai-grok-sandbox = { path = "../xai-grok-sandbox", default-features = false }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }

# Binary hardening: compile-time string + control-flow obfuscation.
obfstr = { workspace = true }
cryptify = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
# Default allocator on Unix; gated by the `jemalloc` feature (see main.rs
# `#[global_allocator]`, cfg(all(feature = "jemalloc", unix))).
# `stats` is binary-scoped only (not workspace-wide) so this CLI jemalloc
# link gets --enable-stats for stats.allocated / stats.resident mallctl.
tikv-jemallocator = { workspace = true, optional = true, features = ["stats"] }
# Raw mallctl for the memory-cliff arena purge hook (see
# `purge_jemalloc_retained_pages` + the `install_release_hook` call in
# main.rs). Same version family as the
# allocator; adds no new build units beyond what tikv-jemallocator pulls in.
tikv-jemalloc-sys = { workspace = true, optional = true }
# Heap-profile / stats mallctl helpers (prof.active, prof.dump, epoch, stats.*).
tikv-jemalloc-ctl = { workspace = true, optional = true, features = ["stats", "use_std"] }

[dev-dependencies]
serial_test = { workspace = true }
tempfile = { workspace = true }
# `PagerArgs::try_parse_from` in the CLI-parsing unit tests (needs the
# `clap::Parser` trait in scope).
clap = { workspace = true, features = ["derive"] }

[features]
default = [
    "jemalloc",
    "sandbox-enforce",
    ]
default-bazel = [
    "jemalloc",
    "sandbox-enforce",
    ]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-sys", "dep:tikv-jemalloc-ctl"]
sandbox-enforce = ["xai-grok-pager/sandbox-enforce"]
release-dist = ["xai-grok-pager/release-dist"]
# Experimental App Server WebSocket listener product path. Enables the
# `websocket` feature on `xai-grok-app-server` (which pulls `tokio-tungstenite`
# + `tokio` net/io/time there) and the WS test client in this binary. The
# default build does NOT enable this: the stdio/in-process product path stays
# zero-network. Cleartext non-loopback bind stays `experimental/unsafe`;
# TLS remains a HUMAN gate (D-SEC.13).
app-server-ws = [
    "xai-grok-app-server/websocket",
    "dep:tokio-tungstenite",
    "dep:futures-util",
]
# Experimental MCP Streamable HTTP listener product path. Enables the
# `streamable-http` feature on `xai-grok-mcp-server` (which pulls `axum` +
# `tokio` net there) and the HTTP test client in this binary. The default
# build does NOT enable this: the stdio/in-process product path stays
# zero-network on the MCP side. Cleartext non-loopback bind stays
# `experimental/unsafe`; TLS remains a HUMAN gate (D-SEC.13 / MCP102-HUMAN).
# Fail-closed bearer: the listener refuses to bind when `require_auth` is
# true and the bearer is empty (F-2).
mcp-streamable-http = [
    "dep:xai-grok-mcp-server",
    "xai-grok-mcp-server/streamable-http",
    "dep:reqwest",
]
