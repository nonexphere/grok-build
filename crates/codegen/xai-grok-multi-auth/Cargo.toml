[package]
name = "xai-grok-multi-auth"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Multi-provider auth implementation: credential store, token manager, Codex/xAI providers (goblin fork canonical)"

[features]
default = []

[[bin]]
name = "goblin-codex-models"
path = "src/bin/goblin_models.rs"

[dependencies]

xai-grok-auth = { workspace = true, features = ["native-multi-provider-auth"] }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt-multi-thread", "net", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock"] }
uuid = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
http = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
blake3 = { workspace = true }
fs2 = { workspace = true }
webbrowser = { workspace = true }
dirs = { workspace = true }
once_cell = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
mockito = { workspace = true }
pretty_assertions = { workspace = true }
serial_test = { workspace = true }

[lints]
workspace = true
